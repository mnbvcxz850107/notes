<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0b12">
    <title>投手丘的秘密</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0b12; height: 100%; overflow: hidden; }
      #wrap { position: fixed; top:0; left:0; right:0; bottom:0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { background: #0b0b12; display: block; width: 100%; height: 100%; }
      /* 電腦：維持直式手機比例置中 */
      @media (min-aspect-ratio: 3/5) { #unity-canvas { height: 100vh; width: calc(100vh * 0.5); max-width: 100vw; } }
      #loading { position: fixed; top:0; left:0; right:0; bottom:0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #ff73a0; font: 18px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #0b0b12; }
      #bar { width: 60%; max-width: 320px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 12px; }
      #fill { width: 0; height: 100%; background: #ff73a0; transition: width .2s; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading"><div>投手丘的秘密　載入中…</div><div id="bar"><div id="fill"></div></div><div id="pct" style="font-size:14px;opacity:.7;margin-top:6px">0%</div></div>
    <script>
      // iPhone：靜音鍵會把 WebAudio 一起關掉，且音訊要在第一次觸控後才能啟動。
      // 用一段無聲的 <audio> 在第一次觸控時開始循環播放，把頁面音訊切到「媒體播放」類別，Unity 的 BGM 就能出聲。
      (function () {
        var a = document.createElement("audio");
        a.setAttribute("playsinline", ""); a.setAttribute("webkit-playsinline", ""); a.loop = true; a.preload = "auto";
        a.src = "data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
        var ok = false;
        function unlock() { if (ok) return; var p = a.play(); if (p && p.then) p.then(function () { ok = true; }).catch(function () {}); }
        ["touchstart", "touchend", "mousedown", "click", "keydown"].forEach(function (e) { document.addEventListener(e, unlock, { passive: true }); });
        document.addEventListener("visibilitychange", function () { if (!document.hidden && ok) a.play().catch(function () {}); });
      })();
    </script>
    <script src="Build/web4.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/web4.data.unityweb",
        frameworkUrl: "Build/web4.framework.js.unityweb",
        codeUrl: "Build/web4.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "furyan",
        productName: "投手丘的秘密",
        productVersion: "1.0",
      }, (p) => {
        document.getElementById("fill").style.width = Math.round(p * 100) + "%";
        document.getElementById("pct").textContent = Math.round(p * 100) + "%";
      }).then(() => {
        document.getElementById("loading").remove();
      }).catch((message) => { alert(message); });
    </script>
  </body>
</html>
