  qiu: { name: "邱望", img: "tsp_qiu" },
  ahe: { name: "阿禾", img: "tsp_ahe" },

};
const SCRIPT = [
["label","start"],
["ch","第一章　三點十七分"],
["bg","ts02_classroom"],
["n","邱望是在黑板前面發現的。"],
["n","高二的物理課，下午第六節，全班三十二個人有一半在打瞌睡。他正在講等速圓周運動，粉筆在黑板上畫了一個圓。"],
["n","畫到四分之三的時候，他聽到窗外的鳥叫聲停了。"],
["n","不是變小，是停。像有人按了靜音。"],
["n","他轉過頭。窗外有一隻麻雀，在空中。翅膀張開，不動。像一張貼在天空上的照片。"],
["n","他看了三秒。然後他回頭看教室。"],
["n","三十二個學生，一半趴著，一半坐著。坐著的那一半，眼睛睜著，看著黑板，不動。"],
["n","第三排那個永遠在轉筆的男生，筆在他的指尖上，斜的，停在半空中。空氣中有粉筆灰，一粒一粒的，懸著，在光裡發亮。"],
["n","沒有聲音。"],
["s","qiu","……陳冠宇？"],
["n","沒有人回答。他走下講台，伸手碰了一下第一排學生的肩膀。"],
["n","肩膀是溫的，可是像石頭一樣硬——不是硬，是「不動」。他的手推不動它，像推一堵牆。"],

["s","qiu","（我在做夢。）"],
["n","他掐了自己的手臂。很痛。"],
["bg","ts03_corridor"],
["n","走廊上有一個學生，正在跑，一隻腳離地，身體往前傾——停在那裡。"],
["n","他繞過那個學生，走下樓梯，走到操場。"],
["bg","ts01_title"],
["n","操場上有一場籃球賽。球在空中，離籃框大約一公尺，五個人仰著頭看它。"],
["n","天空是灰的。他抬頭，看到雨已經開始下了——雨滴懸在空中，密密麻麻的，一顆一顆，像一整片玻璃珠。"],
["n","他伸出手，碰了一顆。它不動。他的手指穿過去的時候，它還是在那裡，濕的，冷的，可是不落下來。"],
["n","他站在操場中央，在一片懸著的雨裡。"],
["n","三點十七分。"],

["ch","第二章　靜止的鎮"],
["bg","ts04_street"],
["n","石岡坪是苗栗山裡的一個小鎮。人口三千，一條主街，一間高中，一座廟，一間便利商店，一間農會。"],
["n","邱望在這裡住了十八年。他的太太曉芸是這裡人，在農會上班。他們沒有小孩，住在鎮東邊一間兩層樓的老房子。"],
["n","街上有十幾個人。騎機車的阿榮，機車傾斜著，正在轉彎。提菜籃的阿嬌，一隻腳踏在騎樓的台階上。"],
["n","便利商店的門開到一半，一個小孩在門裡，手裡拿著一根冰棒，冰棒的頂端有一滴水，懸著。"],
["n","他一個一個走過去看。他們的眼睛是睜著的，可是不看他。他們在看三點十七分那一秒他們在看的東西。"],
["bg","ts05_office"],
["n","他走到農會。"],
["n","曉芸的位子是空的。電腦開著，游標在一個格子裡，閃到一半——停在亮的那一瞬間。椅子往後推，包包不在。"],
["n","她出去了。"],
["n","他拿出手機，撥她的號碼。螢幕亮了，可是撥號的聲音沒有出來。訊號是空的。螢幕上的時間：三點十七分。"],
["s","qiu","（她會去哪裡？下午三點……菜市場？廟口找阿嬌？或者——）"],
["n","他忽然想起來。今天是星期三。"],

["s","qiu","山路。"],
["n","他開始跑。"],

["bg","ts04_street"],
["n","他跑到鎮的西邊，山路的入口，然後他停下來。"],
["s","qiu","（如果她已經回來了呢？如果她今天沒有去，如果她現在正在家裡，在後院，在廚房？）"],
["choice",[["先回家看看","c3_home"],["直接上山路找她","c3_road"]]],
["label","c3_road"],
["n","他往山路踏了兩步，又停下來。十二公里。如果她根本不在山上，他會在一片灰色裡白走一趟，而她在家裡等他。"],
["n","他往回跑。"],
["label","c3_home"],
["bg","ts06_kitchen"],
["n","門口的桂花懸在半空中，有幾朵正在落，停在離地面三十公分的地方。他推開門。"],
["n","客廳沒有人。廚房沒有人。爐子上有一鍋咖哩，鍋蓋掀開一半，冒出來的蒸氣停在空中，像一團白色的棉花。"],
["n","桌上有一張紙，是曉芸的字。"],
["s","yun","「去拿藥。回來煮咖哩。你先吃水果。」"],
["n","旁邊放著一盤切好的芭樂。"],
["n","她三點出門。三點十七分。她在路上。"],
["n","他拿起一片芭樂，放進嘴裡。沒有味道。像吃空氣。"],
["bg","ts07_bedroom"],
["n","他走上二樓。床是鋪好的，曉芸每天早上都鋪。床頭櫃上有她的眼鏡，一本翻到一半的書，一杯喝了一半的水。杯子外面有幾滴水珠，懸著。"],
["n","他在床上躺下來。他不累，可是他躺著。"],
["n","天花板上有一片水漬，是去年颱風留下的。曉芸說要修，他說再看看，然後就沒有修。"],
["n","然後他睡著了。"],
["bg","ts08_dream"],
["n","他做了一個夢。夢裡的東西是會動的。"],
["n","曉芸在廚房裡煮咖哩，蒸氣往上冒，她回過頭。"],
["s","yun","你回來了？"],

["s","yun","先吃水果。"],
["s","qiu","好。"],
["n","就這樣。一個很普通的夢。"],
["bg","ts07_bedroom"],
["n","他醒過來的時候，天還是三點十七分的灰。蒸氣還懸在空中。"],
["n","他下樓，走出門，往山路走。這次他沒有跑。因為他知道，不管他跑多快，那裡都是三點十七分。"],

["s","qiu","（如果我不走。如果我永遠在這裡——）"],

  run()}
function renderEnds(){const e=$('ends');e.innerHTML='';[['photo','照片'],['alone','一個人的三點十八分'],['true','三點十八分']].forEach(([k,t])=>{const s=document.createElement('span');s.textContent=(st.ends[k]?'✓ ':'')+t;if(st.ends[k])s.className='got';e.appendChild(s)});const n=Object.keys(st.ends).length;$('mChapS').textContent=n?`已達成 ${n}/3 結局`:'';}
function showTitle(){$('title').style.display='';$('ending').classList.remove('on');$('choices').classList.remove('on');$('box').style.visibility='';clearTimeout(typing);typing=null;auto=false;skip=false;$('bAuto').classList.remove('on');$('bSkip').classList.remove('on');const has=st.pc>1&&SCRIPT[st.pc]&&SCRIPT[st.pc][0]!=='end';$('mCont').disabled=!has;$('mContS').textContent=has?(curChap||'').replace('　',' · '):'';renderEnds()}
$('cover').style.backgroundImage=`url(${imgUrl('ts01_title')})`;
$('mNew').onclick=()=>{st.flags={};st.log=[];startAt(0)};
$('mCont').onclick=()=>{if($('mCont').disabled)return;$('title').style.display='none';if(curBg)setBg(curBg,true);$('chap').textContent=(curChap||'').replace('　',' · ');run()};
$('mChap').onclick=()=>{renderChapters();$('chapters').classList.add('on')};
$('mmChap').onclick=()=>{$('menu').classList.remove('on');renderChapters();$('chapters').classList.add('on')};
$('mmTitle').onclick=()=>{$('menu').classList.remove('on');save();showTitle()};
$('mmRestartChap').onclick=()=>{$('menu').classList.remove('on');let j=st.pc;while(j>0&&SCRIPT[j][0]!=='ch')j--;startAt(j)};
$('endTitle').onclick=()=>{st.pc=0;save();showTitle()};
$('endBack').onclick=()=>{if(st.lastChoice==null)return;$('ending').classList.remove('on');// clear flags set after the choice
  st.flags={};for(let i=0;i<st.lastChoice;i++){if(SCRIPT[i][0]==='flag')st.flags[SCRIPT[i][1]]=1}startAt(st.lastChoice)};
preload('ts01_title');preload('ts02_classroom');preload('tsp_qiu');preload('tsp_ahe');
showTitle();
})();
</script>
